name: generate-gitcode-snake

on:
  # run automatically every day (UTC)
  schedule:
    - cron: "0 0 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push to any branch (except output, which is written by
  # this workflow itself and would otherwise cause an endless loop)
  push:
    branches-ignore:
      - output

jobs:
  generate:
    runs-on: euleros-2.10.1

    steps:
      - name: checkout
        uses: checkout-action@0.0.1

      - name: setup node
        uses: setup-node@0.0.1
        with:
          node-version: "22"

      # fetch GitCode activity (events api + authored commits), solve the
      # snake route with vendored snk code and emit svgs into dist/
      # secret configured at: 项目设置 -> Action秘钥与变量 -> GITCODE_TOKEN
      - name: generate gitcode-contribution-grid-snake.svg
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_CALENDAR_JSON: calendar.json
        run: |
          cd repo_workspace
          npm config set registry https://registry.npmmirror.com
          npx -y tsx generator/run.ts

      # raw.gitcode.com stopped serving svg from /raw/<branch>/ urls (it now
      # 302s to a cannot_preview placeholder), so README points at the
      # content-addressed /blobs/<sha>/ url instead. the sha changes with
      # every regeneration, so rewrite README and push it before the
      # orphan-checkout below destroys the working tree.
      - name: bump snake url in readme
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          cd repo_workspace
          LIGHT_SHA=$(git hash-object dist/gitcode-contribution-grid-snake.svg)
          sed -i -E "s#(raw\.gitcode\.com/weixin_51634168/weixin_51634168)/blobs/[0-9a-f]+(/gitcode-contribution-grid-snake\.svg)#\1/blobs/${LIGHT_SHA}\2#" README.md
          git diff --quiet README.md && git diff --quiet calendar.json && { echo "nothing to bump"; exit 0; }
          git config user.name "gitcode-bot"
          git config user.email "gitcode-bot@noreply.gitcode.com"
          git add README.md calendar.json
          git commit -m "chore: bump snake svg url"
          REPO_OWNER="${ATOMGIT_REPOSITORY%/*}"
          git push "https://${REPO_OWNER}:${GITCODE_TOKEN}@gitcode.com/${ATOMGIT_REPOSITORY}.git" HEAD

      # publish the svgs to the output branch (history is force-overwritten,
      # the branch only ever hosts the two svg files)
      - name: push svgs to the output branch
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          cd repo_workspace
          git config user.name "gitcode-bot"
          git config user.email "gitcode-bot@noreply.gitcode.com"
          git checkout --orphan output-publish
          git rm -rf . > /dev/null 2>&1 || true
          cp dist/*.svg .
          git add *.svg
          git commit -m "update gitcode snake svg" || { echo "no changes"; exit 0; }
          REPO_OWNER="${ATOMGIT_REPOSITORY%/*}"
          git push -f "https://${REPO_OWNER}:${GITCODE_TOKEN}@gitcode.com/${ATOMGIT_REPOSITORY}.git" HEAD:output
