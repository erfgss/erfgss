name: Update GitHub contribution snake

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      - 'generator/**'
      - 'github-calendar.json'

permissions:
  contents: write

concurrency:
  group: github-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate complete contribution calendar
        run: npx --yes tsx@4.20.6 generator/github.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save updated animations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-colorful-complete*.svg github-calendar.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update GitHub contribution snake'
            git push origin HEAD:main
          fi
